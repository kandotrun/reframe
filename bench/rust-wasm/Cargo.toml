[package]
name = "reframe-rust-bench"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
unicode-normalization = "=0.1.24"
wasm-bindgen = "=0.2.121"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
